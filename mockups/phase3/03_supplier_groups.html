<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نماذج مجموعات الموردين — A-H CODE</title>
<style>
:root{
  --green:#137A38; --green-dark:#0F6B30; --text:#111827; --muted:#64748B;
  --border:#D9E2EC; --card-border:#E2E8F0; --input:#CBD5E1; --content:#F1F5F9;
  --card:#FFFFFF; --alt:#F8FAFC; --sel:#DDF3E6; --first:#ECFDF3; --red:#DC2626;
  --badge-bg:#ECFDF3; --badge-tx:#087443; --badge-bd:#B7E4C7;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#E9EEF3;color:var(--text);font-size:14px}
.top{background:var(--green-dark);color:#fff;padding:14px 20px;position:sticky;top:0;z-index:10}
.top h1{margin:0 0 4px;font-size:20px;font-weight:900}
.top p{margin:0;font-size:13px;opacity:.9}
.wrap{padding:18px;max-width:1500px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(620px,1fr));gap:18px}
.opt{background:#fff;border:1px solid var(--card-border);border-radius:10px;padding:12px;overflow:hidden}
.opt h3{margin:0 0 2px;color:var(--green);font-size:16px;font-weight:900}
.opt h3 span{display:inline-block;background:var(--green);color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;margin-left:6px;font-size:13px}
.opt .d{color:var(--muted);font-size:12.5px;margin:0 0 10px;min-height:34px}
.stage{background:#CBD5E1;border-radius:8px;padding:10px;display:flex;justify-content:center;align-items:center;min-height:430px;overflow:hidden}
.note{background:#FFF7ED;color:#9A3412;border:1px solid #FED7AA;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;line-height:1.7}
.note ul{margin:4px 0 0;padding-right:18px}
@media (max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}

/* ===== مكونات Hr GAD ===== */
.win{background:var(--content);border:1px solid #94A3B8;border-radius:6px;overflow:hidden;width:100%;height:410px;display:flex;flex-direction:column;font-size:10px;position:relative}
.wt{height:20px;background:#fff;border-bottom:1px solid var(--card-border);font-size:9px;font-weight:800;display:flex;align-items:center;padding:0 8px;gap:6px;flex-shrink:0}
.wt span:last-child{margin-right:auto;color:var(--muted)}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.tb{background:#fff;border-bottom:1px solid var(--card-border);padding:5px;display:flex;gap:3px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.bt{color:#fff;border-radius:4px;padding:3px 6px;font-weight:800;font-size:8.5px;white-space:nowrap}
.b-new{background:#1A7A3C}.b-edit{background:#64748B}.b-save{background:#2563EB}.b-del{background:#DC2626}
.b-can{background:#6B7280}.b-ref{background:#fff;color:#111827;border:1px solid #CBD5E1}.b-exit{background:#374151}
.b-tog{background:#B45309}.b-exp{background:#0E7490}.b-dis{background:#CBD5E1}
.mode{background:var(--badge-bg);color:var(--badge-tx);border:1px solid var(--badge-bd);border-radius:10px;padding:2px 8px;font-weight:900;font-size:8.5px}
.mode.ed{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
.content{flex:1;min-height:0;padding:7px;display:flex;gap:7px;overflow:hidden}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{overflow:auto;min-height:0;flex:1}
.gb{background:#fff;border:1px solid var(--card-border);border-radius:7px;padding:14px 7px 7px;position:relative;margin-top:6px}
.gb>.t{position:absolute;top:-1px;right:8px;color:var(--green);font-weight:900;font-size:9.5px;background:#fff;padding:0 4px;transform:translateY(-50%)}
.f{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.f label{width:70px;font-size:8.5px;font-weight:700;color:#334155;flex-shrink:0}
.f i{flex:1;height:16px;border:1px solid var(--input);border-radius:4px;background:#F8FAFC;font-style:normal;font-size:8px;padding:1px 4px;color:#475569;overflow:hidden;white-space:nowrap}
.f i.lock{background:#F1F5F9;color:#64748B}
.tbl{width:100%;border-collapse:collapse;font-size:8.5px;background:#fff}
.tbl th{background:var(--green);color:#fff;font-weight:900;padding:3px;text-align:right;position:sticky;top:0;z-index:1}
.tbl td{padding:3px;border-bottom:1px solid #EEF2F6;white-space:nowrap}
.tbl tr:nth-child(even) td{background:var(--alt)}
.tbl tr.sel td{background:var(--sel)}
.tbl td:first-child{background:var(--first)}
.tbl tr.sec td{background:#E8F5EC;color:var(--green);font-weight:900}
.tbl tr.off td{color:#94A3B8}
.tbl tr.tot td{background:#F1F5F9;font-weight:900}
.tbl tr.err td{background:#FEE2E2;color:#B91C1C;font-weight:800;white-space:normal}
.tbl .n{text-align:left;direction:ltr}
.srch{display:flex;gap:4px;margin-bottom:4px;align-items:center}
.srch i{flex:1;height:16px;border:1px solid var(--input);border-radius:4px;background:#fff;font-style:normal;font-size:8px;padding:1px 4px;color:var(--muted)}
.cnt{color:var(--muted);font-size:8px;margin-top:3px;font-weight:700}
.ltr{direction:ltr;unicode-bidi:isolate}
.bdg{display:inline-block;border-radius:9px;padding:1px 6px;font-size:8px;font-weight:900;border:1px solid;white-space:nowrap}
.bdg.ok{background:#ECFDF3;color:#087443;border-color:#B7E4C7}
.bdg.no{background:#FEE2E2;color:#B91C1C;border-color:#FECACA}
.bdg.x{background:#F1F5F9;color:#64748B;border-color:#E2E8F0}
.bdg.pj{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
.bdg.ty{background:#FEF3C7;color:#92400E;border-color:#FDE68A}
.bdg.cc{background:#F5F3FF;color:#6D28D9;border-color:#DDD6FE}
.tabs2{display:flex;gap:2px;flex-wrap:wrap;flex-shrink:0}
.tabs2 span{padding:4px 8px;border-radius:5px 5px 0 0;font-weight:800;font-size:8.5px;background:#E2E8F0;color:#475569;cursor:pointer}
.tabs2 span.on{background:var(--green);color:#fff}
.tabs2 span em{font-style:normal;background:#fff;color:var(--green);border-radius:7px;padding:0 4px;margin-right:3px;font-size:7.5px}
.tabs2 span:not(.on) em{background:#CBD5E1;color:#334155}
select.lv{flex:1;min-width:0;height:16px;border:1px solid #2563EB;border-radius:4px;background:#F5F9FF;font:inherit;font-size:8.5px;font-weight:800;padding:0 2px;color:#111827;outline:none;max-width:100%}
.tbl select.lv{width:100%;height:15px}
select.lv.bad{border-color:#DC2626;background:#FEF2F2;color:#B91C1C}
input.cb{accent-color:#2563EB;margin:0;width:11px;height:11px;cursor:pointer}
.hint{color:var(--muted);font-size:8px;font-weight:700;margin-top:3px}
.ok-line{color:#087443;font-size:8.5px;font-weight:800}
.bad-line{color:#B91C1C;font-size:8.5px;font-weight:800}
.side{width:122px;flex-shrink:0;background:#fff;border:1px solid var(--card-border);border-radius:7px;padding:5px;display:flex;flex-direction:column;gap:2px}
.side .it{padding:4px 5px;border-radius:5px;font-weight:800;font-size:9px;cursor:pointer;display:flex;align-items:center;gap:4px}
.side .it.on{background:var(--first);color:var(--green);box-shadow:inset -3px 0 0 var(--green)}
.side .it small{margin-right:auto;font-size:7.5px;color:var(--muted)}
.tree{font-size:8.5px;background:#fff;border:1px solid var(--card-border);border-radius:5px}
.tree div{padding:2px 3px;border-bottom:1px solid #F1F5F9;white-space:nowrap;display:flex;gap:3px;align-items:center;cursor:pointer}
.tree div.sel{background:var(--sel);font-weight:800}
.tree div.off{color:#94A3B8}
.tree div.hl{background:#FEF9C3}
.tree div.sel.hl{background:var(--sel)}
.tg{display:inline-block;width:9px;text-align:center;color:var(--green);font-weight:900;cursor:pointer;flex-shrink:0}
.mini{display:inline-block;border-radius:4px;padding:1px 5px;font-size:7.5px;font-weight:900;cursor:pointer;border:1px solid var(--input);background:#fff;color:#334155}
.chipf{display:inline-block;border-radius:10px;padding:2px 8px;font-size:8px;font-weight:800;border:1px solid var(--input);background:#fff;color:#475569;cursor:pointer}
.chipf.on{background:var(--green);color:#fff;border-color:var(--green)}
.itabs{display:flex;gap:2px;border-bottom:2px solid var(--green);margin-top:4px;flex-shrink:0}
.itabs span{padding:3px 7px;font-weight:800;font-size:8.5px;background:#E2E8F0;color:#475569;border-radius:4px 4px 0 0;cursor:pointer}
.itabs span.on{background:var(--green);color:#fff}
.hdr{background:#fff;border:1px solid var(--card-border);border-right:4px solid var(--green);border-radius:6px;padding:5px 7px;flex-shrink:0}
.hdr b{font-size:10.5px}
.hdr .p{color:var(--muted);font-size:8px;font-weight:700;margin-top:2px}
.org{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;align-items:start}
.oc{background:#fff;border:1px solid var(--card-border);border-radius:6px;padding:3px 5px;font-size:8px;cursor:pointer;margin-bottom:3px}
.oc.r{background:var(--green);color:#fff;font-weight:900;font-size:9px;text-align:center;border-color:var(--green)}
.oc.c{border-right:3px solid var(--green);font-weight:800}
.oc.g{margin-right:9px;border-right:3px solid #93C5FD;color:#334155}
.oc.sel{outline:2px solid #2563EB;background:#EFF6FF;color:#111827}
.oc.off{color:#94A3B8;border-style:dashed}
.oc small{display:block;color:var(--muted);font-weight:700;font-size:7px}
.oc.r small{color:#D1FAE5}
.lane{border-left:1px dashed #CBD5E1;padding-left:4px}
.lane:last-child{border-left:none}
.btn-s{display:inline-block;border-radius:4px;padding:1px 5px;font-size:7.5px;font-weight:900;color:#fff;background:#1A7A3C;cursor:pointer;white-space:nowrap}
.btn-s.g{background:#64748B}.btn-s.d{background:#CBD5E1;cursor:default}
.bar{display:inline-block;height:6px;background:var(--green);border-radius:3px;vertical-align:middle}
.bar.e{background:#F59E0B}
/* ===== إضافات (كروت، مؤشرات، خانات كتابة) ===== */
.pg{display:inline-block;width:42px;height:5px;background:#E2E8F0;border-radius:3px;vertical-align:middle;overflow:hidden}
.pg span{display:block;height:100%;background:var(--green)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pc{background:#fff;border:1px solid var(--card-border);border-right:3px solid var(--green);border-radius:6px;padding:4px 6px;cursor:pointer;font-size:8px;line-height:1.5}
.pc.done{border-right-color:#94A3B8;background:#F8FAFC}
.pc.sel{outline:2px solid #2563EB;background:#EFF6FF}
.pc b{font-size:8.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .m{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .r{display:flex;justify-content:space-between;align-items:center;gap:3px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex-shrink:0}
.kp{background:#fff;border:1px solid var(--card-border);border-radius:6px;padding:4px 6px}
.kp small{display:block;color:var(--muted);font-size:7.5px;font-weight:800}
.kp b{font-size:10.5px;direction:ltr;unicode-bidi:isolate}
.kp.g{border-right:3px solid var(--green)}.kp.g b{color:#087443}
.kp.r{border-right:3px solid #DC2626}.kp.r b{color:#B91C1C}
.kp.b{border-right:3px solid #2563EB}
input.lv{flex:1;min-width:0;height:16px;border:1px solid #2563EB;border-radius:4px;background:#F5F9FF;font:inherit;font-size:8.5px;font-weight:800;padding:0 4px;color:#111827;outline:none}
input.lv.bad{border-color:#DC2626;background:#FEF2F2;color:#B91C1C}
.nav{display:flex;gap:3px;align-items:center;justify-content:center;background:#fff;border:1px solid var(--card-border);border-radius:6px;padding:3px;flex-shrink:0}
.nav .mini{font-size:9px;padding:1px 7px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.qs{background:#EFF6FF;color:#1E3A8A;border:1px solid #BFDBFE;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;line-height:1.8}
.qs ol{margin:4px 0 0;padding-right:20px}
.bdg.wr{background:#FEF3C7;color:#92400E;border-color:#FDE68A}
.sec2{color:var(--green);font-weight:900;font-size:8.5px;margin:4px 0 2px;border-bottom:1px dashed #CBD5E1}
.tbl td input.lv,.tbl td select.lv{width:100%;height:15px}
.gcard{background:#fff;border:1px solid var(--card-border);border-top:3px solid var(--green);border-radius:7px;padding:5px 7px;cursor:pointer;font-size:8px;line-height:1.6}
.gcard.sel{outline:2px solid #2563EB;background:#EFF6FF}
.gcard.off{border-top-color:#94A3B8;color:#64748B}
.gcard b{font-size:9.5px;display:block}
.gcard .big{font-size:12px;font-weight:900;color:var(--green)}
.dlg{position:absolute;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:center;justify-content:center}
.dlg .box{background:#fff;border-radius:7px;width:66%;box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden}
.dlg .bh{background:var(--green);color:#fff;font-weight:900;font-size:9.5px;padding:4px 8px}
.dlg .bb{padding:6px 8px}
</style>
</head>
<body>
<div class="top">
  <h1>A-H CODE — نماذج مجموعات الموردين (المرحلة 3ب · الشاشة 1)</h1>
  <p>10 نماذج بنفس ألوان وخطوط Hr GAD — الفرق في الترتيب. اختار رقم (أو قول خد كذا من نموذج وكذا من نموذج). المجموعات والموردين <b>أمثلة وهمية</b>، و<b>الخانات الزرقا شغالة</b>: دوس على أي مجموعة، غيّر الافتراضي، وجرّب «مجموعة جديدة» في النموذج 7.</p>
</div>
<div class="wrap">
  <div class="note" id="note"></div>
  <div class="qs" id="qs"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
// ===== المجموعات: [0 الكود، 1 الاسم، 2 EN، 3 حساب الرقابة، 4 مدة السداد، 5 العملة، 6 ض.ق.م، 7 خصم المنبع، 8 نشط، 9 ملاحظات] =====
const G=[
 ["1","موردين — عام","General Suppliers","2101",30,"EGP","VAT14","",true,"المجموعة الافتراضية لأي مورد جديد"],
 ["2","موردين أجهزة ومعدات تكييف","HVAC Equipment","2101",45,"EGP","VAT14","WHT1",true,""],
 ["3","موردين خامات ومستلزمات","Materials & Consumables","2101",30,"EGP","VAT14","WHT1",true,""],
 ["4","مقاولين باطن وتركيبات","Subcontractors","2101",30,"EGP","VAT14","WHT3",true,"تركيبات — خصم 3%"],
 ["5","خدمات (نقل، شحن، صيانة)","Services","2101",15,"EGP","VAT14","WHT3",true,""],
 ["6","مكاتب استشارية ومهن حرة","Professional Services","2101",30,"EGP","VAT14","WHT5",true,"محاسبين، محامين، استشاريين"],
 ["7","موردين أجانب (استيراد)","Foreign Suppliers","2101",60,"USD","","",true,"ض.ق.م بتتدفع في الجمرك — مش على فاتورة المورد"],
];
// ===== الموردين (أسامي وهمية): [الكود، الاسم، المجموعة، مدة السداد، العملة، المستحق له (توضيحي)] =====
const C=[
 ["12","الشرق لتجارة أجهزة التكييف","2",45,"EGP",845000],
 ["27","المتحدة للمعدات الهندسية","2",60,"EGP",312500],
 ["8","دلتا للمواسير والعزل","3",30,"EGP",96400],
 ["31","النور للكابلات والمستلزمات الكهربائية","3",30,"EGP",54200],
 ["19","الأمل للتركيبات الميكانيكية","4",30,"EGP",128000],
 ["22","فريق الصفوة للتركيبات","4",15,"EGP",0],
 ["40","السريع للنقل والشحن","5",15,"EGP",18750],
 ["44","مركز الدقة للصيانة","5",30,"EGP",7200],
 ["9","مكتب الحساب للمراجعة","6",30,"EGP",15000],
 ["51","Orient Cooling Co.","7",60,"USD",42000],
 ["3","مؤسسة الفجر التجارية","1",30,"EGP",22300],
];
const TAX={VAT14:"ض.ق.م 14%",EXEMPT:"معفي","":"—",WHT1:"خصم منبع 1% (توريدات)",WHT3:"خصم منبع 3% (خدمات)",WHT5:"خصم منبع 5% (مهن حرة)"};
const TAXS={VAT14:"14%",EXEMPT:"معفي","":"—",WHT1:"1%",WHT3:"3%",WHT5:"5%"};
const VATO=["VAT14","EXEMPT",""], WHTO=["","WHT1","WHT3","WHT5"];
const ACC={"2101":"الموردين"};
const N=c=>`<span class="ltr">${c}</span>`;
const m0=n=>Number(n).toLocaleString("en-US",{maximumFractionDigits:2});
const GM=()=>Object.fromEntries(G.map(g=>[g[0],g]));
const mem=g=>C.filter(c=>c[2]===g);
const accName=a=>ACC[a]||"؟";
const ST={s1:"4", s3:"4", s4:"6", s5:"4", s6:"2",ap6:"new",nt6:"60", n7name:"موردين قطع غيار",n7term:"30",n7cur:"EGP",n7vat:"VAT14",n7wht:"WHT3", s8:"4",t8:"sup", s9:"2",mv9:"3",to9:"3", n10:"موردين عدد وأدوات"};
const OWN={};

function win(inner,title="🗂️ مجموعات الموردين — A-H CODE"){return `<div class="win"><div class="wt"><span>${title}</span><span>_ ▢ ✕</span></div><div class="body">${inner}</div></div>`;}
function tb(mode="عرض",w="مجموعة جديدة"){const ed=mode!=="عرض";return `<div class="tb"><span class="bt ${ed?'b-dis':'b-new'}">${w}</span><span class="bt ${ed?'b-dis':'b-edit'}">تعديل</span><span class="bt ${ed?'b-save':'b-dis'}">حفظ</span><span class="bt ${ed?'b-can':'b-dis'}">إلغاء</span><span class="bt ${ed?'b-dis':'b-del'}">حذف</span><span class="bt ${ed?'b-dis':'b-tog'}">إيقاف / تفعيل</span><span class="bt b-ref">تحديث</span><span class="bt b-exp">تصدير إكسل</span><span class="bt b-exit">خروج</span><span class="mode ${ed?'ed':''}">${mode}</span></div>`;}
function f(l,v="",c=""){return `<div class="f"><label>${l}</label><i class="${c}">${v}</i></div>`;}
function gb(t,c,st=""){return `<div class="gb" style="${st}"><span class="t">${t}</span>${c}</div>`;}
function sel(key,val,opts,cls=""){return `<select class="lv ${cls}" data-st="${key}">${opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${v}" ${v===val?'selected':''}>${t}</option>`;}).join("")}</select>`;}
const stB=g=>g[8]?'<span class="bdg ok">نشط</span>':'<span class="bdg x">موقوف</span>';
const taxB=g=>`<span class="bdg pj">ض.ق.م ${TAXS[g[6]]}</span>${g[7]?` <span class="bdg wr">منبع ${TAXS[g[7]]}</span>`:''}`;
const cnt=()=>`<div class="cnt">${G.length} مجموعة · ${C.length} مورد (أمثلة وهمية) — في الأكسس مفيش مجموعات موردين (الموردين هيتوزّعوا وقت النقل، والباقي على «موردين — عام»)</div>`;
const accOpts=()=>Object.keys(ACC).map(k=>[k,`${k} ${ACC[k]}`]);
const due=ms=>{const e=ms.filter(c=>c[4]==="EGP").reduce((s,c)=>s+c[5],0),u=ms.filter(c=>c[4]==="USD").reduce((s,c)=>s+c[5],0);return (e?m0(e)+" EGP":"")+(e&&u?" · ":"")+(u?m0(u)+" USD":"")||"0";};
function grpTable(key,cols="std"){
  const rows=G.map(g=>`<tr class="${g[0]===ST[key]?'sel':''} ${g[8]?'':'off'}" data-set="${key}" data-v="${g[0]}" style="cursor:pointer"><td>${N(g[0])}</td><td><b>${g[1]}</b>${g[0]==="1"?' <span class="bdg ok">افتراضية</span>':''}</td>${cols==="std"?`<td>${N(g[3])}</td><td class="n">${g[4]} يوم</td><td class="n">${TAXS[g[7]]}</td>`:''}<td class="n">${mem(g[0]).length}</td></tr>`).join("");
  return `<div class="scroll"><table class="tbl"><tr><th>الكود</th><th>المجموعة</th>${cols==="std"?'<th>الحساب</th><th class="n">المدة</th><th class="n">منبع</th>':''}<th class="n">موردين</th></tr>${rows}</table></div>`;}

 ["تعديل الافتراضي + تطبيقه على الموردين","غيّر مدة السداد (الخانة الزرقا) واختار يتطبّق على مين: الجداد بس / اللي على الافتراضي القديم / الكل — والمعاينة بتوريك مين هيتعدّل قبل الحفظ.",m6],

 ["المجموعات فوق + الموردين تحت + نقل مورد","جدول المجموعات فوق، وموردين المختارة تحت، وجنبها «نقل مورد» بيقولك لو النقل بيغيّر الحساب أو خصم المنبع.",m9],

const NOTE=`<b>مجموعات الموردين</b> = جدول <span class="ltr">party.supplier_groups</span> (نسخة من مجموعات العملاء): كل مورد في مجموعة، والمجموعة بتحدد <b>حساب الرقابة</b> اللي المورد بيتقيّد عليه + <b>الافتراضي</b> اللي بيتملى للمورد الجديد.
<ul>
<li><b>الخانات:</b> الكود (بيتولّد لوحده) · الاسم عربي (مطلوب ومايتكررش) + EN · <b>حساب الرقابة</b> (فرعي نشط بدور «الموردين» — الافتراضي 2101) · مدة السداد (يوم) · العملة · <b>ض.ق.م</b> (14% / معفي / من غير — للاستيراد) · <b>خصم المنبع اللي بنخصمه من المورد</b> (1% توريدات · 3% خدمات · 5% مهن حرة — بيروح 2104) · نشط · ملاحظات.</li>
<li><b>الفرق عن العملاء:</b> مفيش «حد ائتمان» (اقتراحي — شوف السؤال 3) · خصم المنبع هنا أهم لأن <b>إحنا</b> اللي بنخصمه ونورّده للضرايب، فلو اتحدد على المجموعة فاتورة الشراء بتاخده لوحدها.</li>
<li><b>مجموعة جاهزة «موردين — عام»</b> (نظامية مابتتمسحش ولا بتتوقف) = الافتراضية لأي مورد جديد ولموردين الأكسس اللي من غير تصنيف.</li>
<li><b>الحماية (زي العملاء):</b> المجموعة اللي فيها موردين مابتتمسحش · الحساب وكود الضريبة المربوطين محميين · لو 2101 اتفرّع المجموعات بتروح لـ «الموردين — عام» لوحدها · <span class="ltr">row_version</span> + سجل التعديلات · الكود الجاي جوه قفل (جهازين في نفس اللحظة ياخدوا رقمين) · index على الحساب والعملة والضرايب.</li>
<li><b>مكانها:</b> قسم «المشتريات» ← «مجموعات الموردين» (القسم ده هيتفتح بيها). الصلاحيات: عرض · إضافة · تعديل · حفظ · حذف · تصدير. <b>بعدها:</b> شاشة الموردين.</li>
</ul>`;

const QS=`<b>❓ محتاج قرارك في دول (مع رقم النموذج) — ولو مارديتش هعمل بالاقتراح زي مجموعات العملاء:</b>
<ol>
<li><b>أسامي المجموعات:</b> اقتراحي أعمل «موردين — عام» بس والباقي تضيفه من الشاشة (زي العملاء). ولا أسجّل الـ 6 دول (أجهزة تكييف · خامات · مقاولين باطن · خدمات · مهن حرة · أجانب)؟</li>
<li><b>حساب الرقابة:</b> كل المجموعات على «2101 الموردين» (اقتراحي) ولا الموردين الأجانب مثلاً بحساب لوحدهم (النموذج 4)؟</li>
<li><b>حد الائتمان للمورد:</b> اقتراحي <b>مانعملوش</b> (مالوش لازمة في المشتريات) — ولا عايزه تنبيه زي العملاء؟</li>
<li><b>خصم المنبع الافتراضي على المجموعة</b> (1% / 3% / 5%) عشان فاتورة الشراء تتملى لوحدها؟ (اقتراحي: أيوه.)</li>
<li><b>شاشة لوحدها في «المشتريات»</b> (اقتراحي) ولا شاشة واحدة للمجموعتين (النموذج 8)؟</li>
</ol>`;

function render(){
  document.getElementById("note").innerHTML=NOTE;
  document.getElementById("qs").innerHTML=QS;
  document.getElementById("grid").innerHTML=M.map((m,i)=>`<div class="opt"><h3><span>${i+1}</span>${m[0]}</h3><p class="d">${m[1]}</p><div class="stage">${m[2]()}</div></div>`).join("");
}
document.addEventListener("change",e=>{
  const t=e.target, k=t.dataset.st;
  if(t.dataset.own){OWN[t.dataset.own]=t.checked;render();return;}
  if(t.dataset.ap){ST.ap6=t.dataset.ap;render();return;}
  if(t.dataset.g){const [i,j]=t.dataset.g.split(":").map(Number);G[i][j]=j===1?t.value:Number(t.value)||0;render();return;}
  if(!k) return;
  if(k.startsWith("g:")){const [,i,j]=k.split(":").map(Number);G[i][j]=t.value;render();return;}
  ST[k]=t.value; render();
});
document.addEventListener("click",e=>{
  if(e.target.matches("input,select,option")) return;
  const s=e.target.closest("[data-set]");
  if(s){ST[s.dataset.set]=s.dataset.v; render();}
});
render();
</script>
</body>
</html>
