<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نماذج شجرة الحسابات — A-H CODE</title>
<style>
:root{
  --green:#137A38; --green-dark:#0F6B30; --text:#111827; --muted:#64748B;
  --border:#D9E2EC; --card-border:#E2E8F0; --input:#CBD5E1; --content:#F1F5F9;
  --card:#FFFFFF; --alt:#F8FAFC; --sel:#DDF3E6; --first:#ECFDF3; --red:#DC2626;
  --badge-bg:#ECFDF3; --badge-tx:#087443; --badge-bd:#B7E4C7;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#E9EEF3;color:var(--text);font-size:14px}
.top{background:var(--green-dark);color:#fff;padding:14px 20px;position:sticky;top:0;z-index:10}
.top h1{margin:0 0 4px;font-size:20px;font-weight:900}
.top p{margin:0;font-size:13px;opacity:.9}
.wrap{padding:18px;max-width:1500px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(620px,1fr));gap:18px}
.opt{background:#fff;border:1px solid var(--card-border);border-radius:10px;padding:12px;overflow:hidden}
.opt h3{margin:0 0 2px;color:var(--green);font-size:16px;font-weight:900}
.opt h3 span{display:inline-block;background:var(--green);color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;margin-left:6px;font-size:13px}
.opt .d{color:var(--muted);font-size:12.5px;margin:0 0 10px;min-height:34px}
.stage{background:#CBD5E1;border-radius:8px;padding:10px;display:flex;justify-content:center;align-items:center;min-height:450px;overflow:hidden}
.note{background:#FFF7ED;color:#9A3412;border:1px solid #FED7AA;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;line-height:1.7}
@media (max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}

/* ===== مكونات Hr GAD (نفس نماذج 1ب) ===== */
.win{background:var(--content);border:1px solid #94A3B8;border-radius:6px;overflow:hidden;width:100%;height:430px;display:flex;font-size:10px;position:relative}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.content{flex:1;padding:8px;position:relative;overflow:hidden;min-height:0}
.tb{background:#fff;border-bottom:1px solid var(--card-border);padding:5px;display:flex;gap:3px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.bt{color:#fff;border-radius:4px;padding:3px 6px;font-weight:800;font-size:8.5px;white-space:nowrap}
.b-new{background:#1A7A3C}.b-sub{background:#15803D}.b-edit{background:#64748B}.b-save{background:#2563EB}.b-del{background:#DC2626}
.b-can{background:#6B7280}.b-ref{background:#fff;color:#111827;border:1px solid #CBD5E1}.b-exit{background:#374151}
.b-tog{background:#B45309}.b-exp{background:#0E7490}.b-prn{background:#6D28D9}
.b-dis{background:#CBD5E1}
.mode{background:var(--badge-bg);color:var(--badge-tx);border:1px solid var(--badge-bd);border-radius:10px;padding:2px 8px;font-weight:900;font-size:8.5px}
.gb{background:#fff;border:1px solid var(--card-border);border-radius:7px;padding:14px 7px 7px;position:relative;margin-top:6px}
.gb>.t{position:absolute;top:-1px;right:8px;color:var(--green);font-weight:900;font-size:9.5px;background:#fff;padding:0 4px;transform:translateY(-50%)}
.f{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.f label{width:70px;font-size:8.5px;font-weight:700;color:#334155;flex-shrink:0}
.f i{flex:1;min-width:0;height:16px;border:1px solid var(--input);border-radius:4px;background:#F8FAFC;font-style:normal;font-size:8px;padding:1px 4px;color:#475569;overflow:hidden;white-space:nowrap}
.f i.lock{background:#F1F5F9;color:#64748B}
.chk{font-size:8.5px;font-weight:700;margin-left:6px}
.chk:before{content:"☑ ";color:var(--green)}
.unchk{font-size:8.5px;font-weight:700;color:#94A3B8;margin-left:6px}
.unchk:before{content:"☐ "}
.tbl{width:100%;border-collapse:collapse;font-size:8.5px;background:#fff}
.tbl th{background:var(--green);color:#fff;font-weight:900;padding:3px;text-align:right;white-space:nowrap}
.tbl td{padding:2px 3px;border-bottom:1px solid #EEF2F6;white-space:nowrap}
.tbl tr:nth-child(even) td{background:var(--alt)}
.tbl tr.sel td{background:var(--sel)!important}
.tbl td.n,.tbl th.n{text-align:left}
.srch{display:flex;gap:4px;margin-bottom:4px}
.srch i{flex:1;height:16px;border:1px solid var(--input);border-radius:4px;background:#fff;font-style:normal;font-size:8px;padding:1px 4px;color:var(--muted)}
.cnt{color:var(--muted);font-size:8px;margin-top:3px;font-weight:700}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}

/* ===== شجرة الحسابات ===== */
.tree{background:#fff;border:1px solid var(--card-border);border-radius:5px;overflow:auto;font-size:8.5px}
.tr{display:flex;align-items:center;gap:3px;padding:2px 4px;border-bottom:1px solid #F1F5F9;white-space:nowrap;cursor:default}
.tr:nth-child(even){background:var(--alt)}
.tr.sel{background:var(--sel)!important;outline:1px solid #86C99D}
.tr.grp{font-weight:800}
.tr.l1{background:#E8F5EC!important;color:var(--green);font-weight:900}
.tr.off{color:#94A3B8}
.tg{width:11px;text-align:center;color:var(--green);cursor:pointer;font-size:8px;flex-shrink:0;user-select:none}
.tg.leaf{color:transparent;cursor:default}
.ic{font-size:9px;flex-shrink:0}
.cd{font-weight:900;color:#334155;min-width:30px}
.tr.l1 .cd{color:var(--green)}
.nm{overflow:hidden;text-overflow:ellipsis}
.bal{margin-right:auto;font-weight:800;direction:ltr;unicode-bidi:isolate;color:#334155;padding-left:2px}
.bal.cr{color:#B45309}
.bdg{display:inline-block;border-radius:9px;padding:0 6px;font-size:7.5px;font-weight:900;border:1px solid;white-space:nowrap;line-height:12px}
.t-asset{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
.t-liab{background:#FFF7ED;color:#B45309;border-color:#FED7AA}
.t-equity{background:#F5F3FF;color:#6D28D9;border-color:#DDD6FE}
.t-rev{background:#ECFDF3;color:#087443;border-color:#B7E4C7}
.t-exp{background:#FEF2F2;color:#B91C1C;border-color:#FECACA}
.b-role{background:#F0FDFA;color:#0F766E;border-color:#99F6E4}
.b-sys{background:#F1F5F9;color:#475569;border-color:#CBD5E1}
.b-off{background:#F1F5F9;color:#94A3B8;border-color:#E2E8F0}
.seg2{display:flex;gap:3px;flex:1}
.seg2 span{flex:1;text-align:center;border:1px solid var(--input);border-radius:4px;padding:1px 0;font-size:8.5px;font-weight:800;color:#64748B;background:#F8FAFC}
.seg2 span.on{background:#ECFDF3;border-color:#137A38;color:#087443}
.seg2 span.on.cr{background:#FFF7ED;border-color:#B45309;color:#B45309}
.tabs2{display:flex;gap:2px;flex-wrap:wrap}
.tabs2 span{padding:3px 8px;border-radius:5px 5px 0 0;font-weight:800;font-size:8.5px;background:#E2E8F0;color:#475569}
.tabs2 span.on{background:var(--green);color:#fff}
.panel{background:#fff;border:1px solid var(--card-border);border-radius:0 7px 7px 7px;padding:6px}
.hint{background:#EFF6FF;border:1px solid #BFDBFE;color:#1D4ED8;border-radius:6px;padding:4px 6px;font-size:8.5px;font-weight:700;margin:3px 0}
.warnb{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:6px;padding:4px 6px;font-size:8.5px;font-weight:700;margin:3px 0}
.okb{background:#ECFDF3;border:1px solid #B7E4C7;color:#087443;border-radius:6px;padding:4px 6px;font-size:8.5px;font-weight:700;margin:3px 0}
.crumb{background:#fff;border:1px solid var(--card-border);border-radius:5px;padding:3px 6px;font-size:8.5px;font-weight:800;color:#334155;margin-bottom:5px}
.crumb b{color:var(--green)}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.col{background:#fff;border:1px solid var(--card-border);border-radius:5px;overflow:hidden}
.col h5{margin:0;background:var(--green);color:#fff;font-size:8.5px;padding:3px 5px;font-weight:900}
.col .it{padding:2px 5px;font-size:8.5px;border-bottom:1px solid #F1F5F9;display:flex;gap:3px;white-space:nowrap}
.col .it.on{background:var(--sel);font-weight:900}
.col .it .arr{margin-right:auto;color:#94A3B8}
.tcard{background:#fff;border:1px solid var(--card-border);border-right:4px solid;border-radius:7px;padding:5px 6px;font-size:8px}
.tcard b{font-size:9.5px;font-weight:900;display:block}
.tcard .r{font-size:12px;font-weight:900;direction:ltr;text-align:right}
.tcard small{color:var(--muted);font-weight:700}
.fchip{display:inline-block;border:1px solid var(--input);border-radius:10px;padding:1px 7px;font-size:8px;font-weight:800;color:#475569;background:#fff;margin:0 0 3px 3px}
.fchip.on{background:var(--first);border-color:#86C99D;color:var(--green)}
.rep{font-size:8.5px}
.rep .h{background:var(--green);color:#fff;font-weight:900;padding:2px 5px;border-radius:4px 4px 0 0}
.rep .r{display:flex;justify-content:space-between;padding:2px 5px;border-bottom:1px solid #EEF2F6}
.rep .r.s{font-weight:900;background:#F8FAFC}
.rep .r.me{background:var(--sel);font-weight:900;outline:1px solid #86C99D}
.rep .r span:last-child{direction:ltr;unicode-bidi:isolate}
input.lv,select.lv{flex:1;min-width:0;height:16px;border:1px solid #2563EB;border-radius:4px;background:#F5F9FF;font:inherit;font-size:8.5px;font-weight:800;padding:0 4px;color:#111827;outline:none}
input.lv:focus,select.lv:focus{box-shadow:0 0 0 2px #BFDBFE}
.mv td.n{direction:ltr;text-align:left}
</style>
</head>
<body>

// الشجرة: opts = {sel, bal, badges, depth (أقصى مستوى مفتوح), only (كود جذر), h}
function tree(o={}){
  const sel=o.sel||"1103", maxOpen=o.depth||3, h=o.h||300;
  const rows=A.filter(a=>!o.only||root(a)[0]===o.only).map(a=>{
    const L=lvl(a), leaf=a[3]===1, open=L<maxOpen, hidden=anc(a).some(c=>lvl(AM[c])>=maxOpen);
    const badges=o.badges?`${a[7]?`<span class="bdg b-role">${ROLE[a[7]]}</span>`:''}${a[10]&&leaf?'<span class="bdg b-sys">🔒</span>':''}${a[11]?'':'<span class="bdg b-off">موقوف</span>'}`:'';
    return `<div class="tr ${L===1?'l1':''} ${leaf?'':'grp'} ${a[0]===sel?'sel':''} ${a[11]?'':'off'}" data-c="${a[0]}" data-anc="${anc(a).join(" ")}" style="padding-right:${4+(L-1)*11}px;${hidden?'display:none':''}"><span class="tg ${leaf?'leaf':''}">${leaf?'•':open?'▾':'▸'}</span><span class="ic">${leaf?'📄':'📁'}</span><span class="cd ltr">${a[0]}</span><span class="nm">${a[1]}</span>${badges}${o.bal?`<span class="bal ${a[4]==="cr"?'cr':''}">${m0(a[12])}</span>`:''}</div>`;
  }).join("");
  return `<div class="tree" style="height:${h}px">${rows}</div>`;
}

function bsPreview(sel="1103"){

}

const SETS=[["📒 شجرة الحسابات",DN,`شاشة «شجرة الحسابات» — أول شاشة في **المرحلة 2 (دليل الحسابات)** وأول شاشة في قسم **«الحسابات»** في القائمة. كل حساب ليه: **الكود** (بيتولّد لوحده تحت الأب: ${N("1")} ← ${N("11")} ← ${N("1103")} ← ${N("110301")})، **الاسم** عربي/إنجليزي، **تحت حساب** (الأب)، **المستوى** (بيتحسب)، **رئيسي** (تجميعي — مابيقبلش قيود) أو **فرعي** (بيقبل قيود)، **نوع الحساب** (أصول / خصوم / حقوق ملكية / إيرادات / مصروفات — بيتورث من الجذر)، **الطبيعة** (مدين / دائن)، **القائمة** (الميزانية / قائمة الدخل — بتتورث)، **التصنيف** (متداول / غير متداول / تكلفة مبيعات / مصروفات تشغيل…) و**بند التدفقات النقدية** — التقارير بتتعمل من الحقول دي **مش من أول رقم في الكود**، **الدور** (خزينة، بنك، العملاء، الموردين، ض.ق.م، جاري شريك، عهد… — البرنامج بيعرف منه أنهي حساب يستخدم في المستندات)، **لازم مع القيد**: طرف (عميل/مورد/موظف) أو مركز تكلفة، **العملة**، **نشط / موقوف**، و**نظامي** 🔒 (حسابات البرنامج محتاجها — مابتتمسحش). **القواعد:** القيود على الحسابات **الفرعية النشطة** بس · حساب عليه قيود مايتمسحش (يتوقف بس) ولا يتحوّل رئيسي · الرئيسي رصيده = مجموع اللي تحته. **العملاء والموردين = حساب رقابة واحد + بُعد الطرف** (قرارك) — مش حساب لكل عميل. الدليل اللي في النماذج = **دليل مصري جاهز مقترح** هيتسجل أول مرة وتعدّل فيه براحتك، و**الأرصدة أمثلة** (بتتحسب من القيود في المرحلة 4).`]];

// ---------- التشغيل ----------
let cur=0;
function nextCode(p){const ks=kids(p).map(a=>a[0]);const width=p.length<2?p.length+1:p.length+2;if(!ks.length)return p+(width-p.length===1?"1":"01");const mx=Math.max(...ks.map(k=>parseInt(k.slice(p.length))||0))+1;return p+String(mx).padStart(width-p.length,"0");}
function upd8(box){
  const p=AM[box.querySelector('[data-k="parent"]').value], nat=box.querySelector('[data-k="nat"]').value||p[4];
  const code=nextCode(p[0]), set=(k,v)=>{const e=box.querySelector(`[data-o="${k}"]`);if(e)e.innerHTML=v;};
  set("code",N(code)+" (اتولّد لوحده)");set("lvl",lvl(p)+1);set("type",typ(p)[1]+" (زي «"+root(p)[1]+"»)");set("stmt",stmt(p));set("role",p[7]?ROLE[p[7]]+" (زي الأب)":"—");
  const name=box.querySelector('[data-k="name"]').value.trim();
  const r=[];
  r.push(`<div class="okb">✔ الكود ${N(code)} تحت ${N(p[0])} ومش متكرر</div>`);
  r.push(name?`<div class="okb">✔ الاسم مكتوب</div>`:`<div class="warnb">✖ الاسم مطلوب</div>`);
  r.push(nat!==p[4]?`<div class="warnb">⚠ الطبيعة «${nat==="dr"?"مدين":"دائن"}» عكس الأب — مقبولة (زي مجمع الإهلاك) بس اتأكد</div>`:`<div class="okb">✔ الطبيعة ${nat==="dr"?"مدين":"دائن"} زي الأب</div>`);
  r.push(p[3]?`<div class="warnb">✖ الأب فرعي — اختار حساب رئيسي</div>`:`<div class="okb">✔ الأب «${p[1]}» رئيسي</div>`);
  r.push(`<div class="hint">🛈 «فرعي» = بيقبل قيود من أول ما يتحفظ</div><div class="hint">🛈 حساب عليه قيود مايتمسحش — بيتوقف بس</div>`);
  if(lvl(p)+1>5)r.push(`<div class="warnb">✖ أقصى عمق 5 مستويات</div>`);
  box.closest(".content").querySelector(".rules8").innerHTML=r.join("");
}
document.addEventListener("input",e=>{const b=e.target.closest&&e.target.closest(".live8");if(b)upd8(b);});
document.addEventListener("change",e=>{const b=e.target.closest&&e.target.closest(".live8");if(b)upd8(b);});
document.addEventListener("click",e=>{
  const t=e.target.closest&&e.target.closest(".tg");if(!t||t.classList.contains("leaf"))return;
  const row=t.closest(".tr"), c=row.dataset.c, box=row.parentElement, open=t.textContent==="▾";
  box.querySelectorAll(".tr").forEach(r=>{const a=r.dataset.anc.split(" ");if(!a.includes(c))return;
    if(open){r.style.display="none";}else if(a[a.length-1]===c){r.style.display="";const g=r.querySelector(".tg");if(!g.classList.contains("leaf"))g.textContent="▸";}});
  t.textContent=open?"▸":"▾";
});
function render(){
  document.getElementById("note").innerHTML=SETS[cur][2].replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  document.getElementById("grid").innerHTML=SETS[cur][1].map((m,i)=>`<div class="opt"><h3><span>${i+1}</span>${m[0]}</h3><p class="d">${m[1]}</p><div class="stage">${m[2]}</div></div>`).join("");
  document.querySelectorAll(".live8").forEach(upd8);
  window.scrollTo(0,0);
}
render();
// ?n=رقم ← نموذج واحد بس (للمراجعة والصور)
const only=new URLSearchParams(location.search).get("n");
if(only){document.querySelector(".top").style.display="none";document.querySelector(".note").style.display="none";document.querySelectorAll(".opt").forEach((o,j)=>o.style.display=j===only-1?"":"none");}
</script>
</body>
