  <p>زي ما طلبت: نفس ترتيب الفاتورة السعودية — الأزرار فوق ← بيانات الفاتورة ← التفاصيل والإجماليات جنبها ← <b>«إضافة صنف» تحت</b>. كل نموذج في صفحة لوحده (الأرقام فوق أو الأسهم)، والبيانات وهمية، وكل النماذج شغالة على نفس الفاتورة.</p>

function calc(d){const R=rate(d);const rows=d.lines.map(l=>{const g=r2(l.q*l.p);const ld=r2(g*(+l.ds||0)/100);return {l,g,ld,net:r2(g-ld)};});
  const sn=r2(rows.reduce((s,r)=>s+r.net,0));let left=r2(Math.min(+d.hd||0,sn));const hd=left;
  rows.forEach((r,i)=>{const sh=i===rows.length-1?left:r2(sn?hd*r.net/sn:0);left=r2(left-sh);r.sh=sh;r.na=r2(r.net-sh);
    const tr=d.kind==="statement"?0:TX[r.l.tx][1]/100;r.tr=tr;if(d.incl){r.base=r2(r.na/(1+tr));r.vat=r2(r.na-r.base);}else{r.base=r.na;r.vat=r2(r.na*tr);}
    r.tot=r2(r.base+r.vat);r.qb=Math.round(r.l.q*fac(r.l)*1e6)/1e6;r.eb=r2(r.base*R);r.ev=r2(r.vat*R);r.uc=r.qb?Math.round(r.eb/r.qb*1e6)/1e6:0;r.svc=!!it(r.l.it)[6];
    // للعرض في الجدول: قبل الضريبة من غير خصم الفاتورة
    r.pre=d.incl?r2(r.net/(1+tr)):r.net;});
  const s=f=>r2(rows.reduce((a,r)=>a+r[f],0));
  return {rows,sn,g:s("g"),ld:s("ld"),hd,hr:sn?r2(hd/sn*100):0,pre:s("pre"),base:s("base"),vat:s("vat"),tot:s("tot"),eb:s("eb"),ev:s("ev"),et:r2(s("eb")+s("ev")),
   inv:r2(rows.filter(r=>!r.svc).reduce((a,r)=>a+r.eb,0)),svc:r2(rows.filter(r=>r.svc).reduce((a,r)=>a+r.eb,0))};}
function lerr(d,r){const l=r.l,i=it(l.it);
  if(!(+l.q>0))return ["no","الكمية لازم أكبر من صفر"];
  if(+l.p<0)return ["no","السعر مايبقاش بالسالب"];

  if(!i[6]&&wh(l.wh)[2])return ["no","المخزن الوهمي مالوش مشتريات"];
  if(+l.p===0)return ["wr","السعر صفر — الصنف هيدخل من غير تكلفة"];
  const lp=LAST[l.it];if(lp&&r.uc&&Math.abs(r.uc-lp)/lp>0.2)return ["wr",`السعر بعيد عن آخر سعر شراء (${mf(lp)} للـ${i[2]}) بأكتر من 20%`];
  return null;}
const dupInv=d=>d.sinv?C.find(x=>x!==d&&x.sup===d.sup&&x.sinv===d.sinv&&x.st==="posted"):null;
function checks(d){const c=calc(d),r=[];const s=sup(d.sup);
  r.push(s?["ok",`المورد: ${s[0]} «${s[1]}»`]:["no","اختار المورد"]);

  c.rows.forEach((x,i)=>{const e=lerr(d,x);if(e)r.push([e[0],`سطر ${i+1} (${x.l.it}): ${e[1]}`]);});
  const du=dupInv(d);if(du)r.push(["no",`رقم فاتورة المورد «${d.sinv}» اتسجل قبل كده لنفس المورد (${du.no})`]);else if(!d.sinv)r.push(["wr","رقم فاتورة المورد فاضي"]);
  if(d.cur!=="EGP")r.push(+d.rate>0?["in",`العملة ${CUR[d.cur][0]} بسعر ${d.rate} — التكلفة والقيد بالجنيه`]:["no","اكتب سعر الصرف"]);
  if(d.kind==="statement")r.push(["in","«بيان»: من غير ض.ق.م، والبضاعة بتدخل رصيد «بيان»"]);else if(!d.einv)r.push(["wr","الرقم الإلكتروني فاضي"]);
  r.push(d.pay==="credit"?["in",`آجل — الاستحقاق ${d.due}`]:["in",`نقدي — سند صرف لوحده من «${PAY.find(p=>p[0]===d.box)[1]}»`]);
  if(c.hd)r.push(["in",`خصم الفاتورة ${mf(c.hd)} اتوزّع على الأصناف بالقيمة وقلّل تكلفتها`]);
  c.rows.filter(x=>!x.svc&&!avg(x.l.it,d.kind)&&!coQty(x.l.it,d.kind)).forEach(x=>r.push(["in",`${x.l.it} مالوش متوسط — هيبقى ${mf(x.uc)}`]));
  if(c.svc)r.push(["in",`صنف خدمي ${mf(c.svc)} ← مصروف من غير مخزون`]);
  if(V.cf&&ed())r.push(["no","الفاتورة اتعدّلت من جهاز تاني — اعمل «تحديث» الأول"]);
  return r;}
function je(d){const c=calc(d),s=sup(d.sup),r=[];if(!s)return [];
  if(c.inv)r.push(["1105 المخزون",c.inv,0]);if(c.svc)r.push(["5201 تكلفة المبيعات — خدمات",c.svc,0]);if(c.ev)r.push(["110601 ض.ق.م — مدخلات",c.ev,0]);
  r.push([`2101 الموردين — ${s[0]}`,0,c.et]);

  return r;}
function stockFx(d){const c=calc(d),m={};c.rows.filter(x=>!x.svc&&x.l.wh&&!wh(x.l.wh)[2]).forEach(x=>{const k=x.l.it;(m[k]||(m[k]={q:0,v:0}));m[k].q+=x.qb;m[k].v+=x.eb;});
  return Object.keys(m).map(k=>{const Q=coQty(k,d.kind),A=avg(k,d.kind);const P=d.st==="posted";const q0=P?Q-m[k].q:Q;const a1=P?A:(q0+m[k].q?(q0*A+m[k].v)/(q0+m[k].q):0);
   const a0=P?(q0>0?Math.max(0,(Q*A-m[k].v)/q0):0):A;return {k,q0,q1:q0+m[k].q,a0,a1};});}

function say(t,mt="ok"){V.msg=t;V.mt=mt;}
function loadF(i){const l=D().lines[i];V.sel=i;V.f={it:l.it,wh:l.wh||D().wh,u:l.u,q:String(l.q),p:String(l.p),ds:String(l.ds||""),tx:l.tx};}
function clearF(keep){const d=D();V.sel=-1;const c=keep||V.f.it;const x=it(c);V.f={it:c,wh:d.wh,u:0,q:"1",p:LAST[c]?String(r2(LAST[c]/rate(d))):"0",ds:"",tx:sup(d.sup)[4]==="VAT0"?"VAT0":x[5]};}
function lineFromF(){const d=D(),f=V.f,x=it(f.it);return {it:f.it,wh:x[6]?"":f.wh,u:+f.u||0,q:+f.q||0,p:+f.p||0,ds:+f.ds||0,tx:d.kind==="statement"?f.tx:f.tx};}
function post(d){if(V.cf){say("✖ مارحّلتش: الفاتورة اتعدّلت من جهاز تاني — اعمل «⟳ تحديث» الأول","no");return;}
  const b=checks(d).filter(c=>c[0]==="no");if(b.length){say("✖ مارحّلتش: "+b[0][1]+(b.length>1?` (و${b.length-1} تاني)`:""),"no");return;}
  const c=calc(d);c.rows.filter(r=>!r.svc).forEach(r=>{const k=r.l.it+"|"+d.kind;const Q=coQty(r.l.it,d.kind),A=avg(r.l.it,d.kind);AVG[k]=Math.round((Q*A+r.eb)/(Q+r.qb)*1e6)/1e6;const bk=`${r.l.it}|${r.l.wh}|${d.kind}`;BAL[bk]=r2((BAL[bk]||0)+r.qb);LAST[r.l.it]=r.uc;});
  if(d.pay==="credit")sup(d.sup)[5]=r2(sup(d.sup)[5]+c.et);
  if(!d.no){SEQ++;d.no="PUR-"+String(SEQ).padStart(5,"0");}d.st="posted";V.sel=-1;
  say(`✔ اترحّلت ${d.no}: البضاعة دخلت المخزن والقيد اتعمل بـ ${mf(c.et)} جنيه${d.pay==="cash"?' + سند صرف':''}`);}
function unpost(d){const c=calc(d);const bad=c.rows.find(r=>!r.svc&&bal(r.l.it,r.l.wh,d.kind)-r.qb<0);
  if(bad&&!V.neg){say(`✖ إلغاء الترحيل هيخلّي ${bad.l.it} في «${wh(bad.l.wh)[1]}» بالسالب (البضاعة اتصرفت بعد الفاتورة) — محتاج صلاحية «من غير رصيد»`,"no");return;}
  c.rows.filter(r=>!r.svc).forEach(r=>{const k=r.l.it+"|"+d.kind;const Q=coQty(r.l.it,d.kind),A=avg(r.l.it,d.kind);const q0=Q-r.qb;if(q0>0)AVG[k]=Math.max(0,Math.round((Q*A-r.eb)/q0*1e6)/1e6);const bk=`${r.l.it}|${r.l.wh}|${d.kind}`;BAL[bk]=r2((BAL[bk]||0)-r.qb);});
  if(d.pay==="credit")sup(d.sup)[5]=r2(sup(d.sup)[5]-c.et);
  d.st="draft";say(`↩ اتلغى ترحيل ${d.no} — رجعت مسودة والرقم ثابت`,"inf");}
function other(){const d=D();
  if(d.st==="posted"){const r=calc(d).rows.find(x=>!x.svc&&bal(x.l.it,x.l.wh,d.kind)>=2);if(r){const bk=`${r.l.it}|${r.l.wh}|${d.kind}`;const take=r2(BAL[bk]-Math.max(0,r.qb-2));BAL[bk]=r2(BAL[bk]-take);say(`🔁 جهاز تاني صرف ${m0(take)} ${it(r.l.it)[2]} «${it(r.l.it)[1]}» — جرّب «إلغاء الترحيل» دلوقتي`,"inf");}else say("مفيش رصيد كفاية للتجربة","no");return;}
  V.cf=1;say("🔁 جهاز تاني فتح نفس الفاتورة وعدّل فيها وحفظ — جرّب «حفظ» دلوقتي","inf");}
function setSup(d,c){const s=sup(c),o=rate(d);d.sup=c;d.cur=s[3];d.rate=CUR[s[3]][1];reprice(d,o);d.due=addDays(d.date,s[2]);d.lines.forEach(l=>{l.tx=s[4]==="VAT0"?"VAT0":it(l.it)[5];});if(c==="SUB-000")d.pay="cash";}
document.addEventListener("change",e=>{const t=e.target,d=D();
  if(t.dataset.show){V[t.dataset.show]=t.checked?1:0;render();return;}
  if(t.dataset.hr!==undefined){const c=calc(d);d.hd=r2(c.sn*Math.max(0,Math.min(100,+t.value||0))/100);V.msg="";render();return;}
  if(t.dataset.h){const k=t.dataset.h,v=t.value;
    if(k==="sup")setSup(d,v);else if(k==="hd")d.hd=Math.max(0,+String(v).replace(/,/g,"")||0);else if(k==="rate")d.rate=Math.max(0,+v||0);else if(k==="incl")d.incl=+v;
    else if(k==="date"){d.date=v;if(d.pay==="credit")d.due=addDays(v,sup(d.sup)[2]);}else if(k==="cur"){const o=rate(d);d.cur=v;d.rate=CUR[v][1];reprice(d,o);}
    else if(k==="pay"){d.pay=v;if(v==="credit")d.due=addDays(d.date,sup(d.sup)[2]);}else d[k]=v;V.msg="";render();return;}
  if(t.dataset.l){const [i,f]=t.dataset.l.split("|");const l=d.lines[+i];if(["q","p","ds"].includes(f))l[f]=+t.value||0;else if(f==="u")l.u=+t.value;else l[f]=t.value;V.msg="";render();return;}
  if(t.dataset.f){const k=t.dataset.f;if(k==="it"){clearF(t.value);}else if(k==="code"){const c=t.value.trim().toUpperCase();if(it(c))clearF(c);else say(`✖ الكود «${c}» مش موجود`,"no");}
    else{V.f[k]=t.value;if(k==="u"){const x=it(V.f.it);V.f.p=LAST[V.f.it]?String(r2(LAST[V.f.it]*x[4][+t.value][1]/rate(d))):V.f.p;}}render();return;}

document.addEventListener("keydown",e=>{const t=e.target;

  if(x=g("[data-htab]")){V.htab=+x.dataset.htab;render();return;}
  if(x=g("[data-lf]")){V.lf=x.dataset.lf;render();return;}
  if(g("[data-ref]")){V.cf=0;say("⟳ اتحدّثت من القاعدة — آخر إصدار للفاتورة قدامك","inf");render();return;}
  if(g("[data-save]")){if(V.cf)say("✖ ماتحفظتش: الفاتورة اتعدّلت من جهاز تاني بعد ما فتحتها — اعمل «⟳ تحديث» وراجع","no");else say("💾 اتحفظت مسودة (من غير قيد ولا حركة مخزون)");render();return;}
  if(g("[data-edit]")){say("المرحّلة ماتتعدّلش — اعمل «إلغاء الترحيل» الأول (بصلاحية)","inf");render();return;}
  if(g("[data-new]")){C.push({no:"",date:"2026-11-27",sup:"SUB-001",sinv:"",einv:"",kind:"invoice",incl:0,cur:"EGP",rate:1,pay:"credit",due:addDays("2026-11-27",30),box:"TRS-001",wh:"WH-001",prj:"",hd:0,note:"",st:"draft",lines:[]});V.d=C.length-1;V.cf=0;clearF();say("＋ فاتورة جديدة (مسودة) — اختار المورد وضيف الأصناف من تحت","inf");render();return;}
  if(g("[data-dup]")){const s=D();C.push({...JSON.parse(JSON.stringify(s)),no:"",sinv:"",einv:"",st:"draft",date:"2026-11-27"});V.d=C.length-1;V.cf=0;clearF();say(`⧉ نسخة جديدة (مسودة) من ${s.no||'المسودة'} بنفس المورد والأصناف — اكتب رقم فاتورة المورد`,"inf");render();return;}
  if(g("[data-post]")){post(d);render();return;}
  if(g("[data-unpost]")){unpost(d);render();return;}
  if(g("[data-del]")){if(C.length>1){C.splice(V.d,1);V.d=C.length-1;clearF();say("🗑 المسودة اتمسحت","inf");}render();return;}
  if(g("[data-can]")){V.sel=-1;clearF();say("✕ اتلغى التعديل اللي ماتحفظش","inf");render();return;}
  if(x=g("[data-row]")){if(ed())loadF(+x.dataset.row);else V.sel=+x.dataset.row;render();return;}
  if(g("[data-add]")){const l=lineFromF();if(!(l.q>0)){say("✖ اكتب الكمية","no");render();return;}
    const ex=d.lines.findIndex(z=>z.it===l.it&&z.wh===l.wh&&z.u===l.u&&z.p===l.p&&!z.ds&&!l.ds);
    if(ex>=0){d.lines[ex].q=r2(d.lines[ex].q+l.q);say(`✔ ${l.it} موجود بنفس السعر — الكمية بقت ${m0(d.lines[ex].q)}`);}else{d.lines.push(l);say(`✔ ${l.it} ${it(l.it)[1]} اتضاف للفاتورة`);}
    clearF(l.it);render();return;}
  if(g("[data-upd]")){if(V.sel>=0){d.lines[V.sel]=lineFromF();say(`✎ السطر ${V.sel+1} اتعدّل`);}clearF();render();return;}
  if(g("[data-clr]")){clearF();V.msg="";render();return;}
  if(g("[data-rm]")){if(V.sel>=0){const z=d.lines.splice(V.sel,1)[0];say(`🗑 ${z.it} اتشال من الفاتورة`,"inf");}clearF();render();return;}
});
clearF();render();
</script>
