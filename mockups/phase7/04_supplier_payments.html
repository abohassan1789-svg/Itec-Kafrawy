const NOTE=`<b>📌 الشاشة بتعمل إيه:</b> لما ندفع فلوس لمورد بـ <b>سند صرف</b>، البرنامج <b>يربط الدفعة بفواتير الشراء</b> اللي اتسددت (كلها أو جزء منها) ← كل فاتورة يبان عليها «اتسدد كام وباقي كام» (مفتوحة · مسددة جزئي · مسددة · متأخرة) ← واللي مااتوزّعش من السند يبقى <b>دفعة مقدمة</b> للمورد تتوزّع بعدين. <b>القيد مابيتغيّرش</b>: مدين المورد / دائن الخزنة أو البنك — التوزيع ده «مطابقة» بين الدفعات والفواتير، ومنه بعدين <b>أعمار الديون</b> وكشف «الفواتير المستحقة».
<ul>
<li><b>كانت إيه في الأكسس:</b> شاشة <span dir="ltr">SanadSup</span> «سندات الموردين» (جدول <span dir="ltr">sanadpaid</span> — 439 سند صرف أو قبض): المورد والمبلغ والنوع بس — <b>من غير ربط بالفواتير</b>، فمكانش ينفع تعرف أنهي فاتورة اتدفعت ولا المتأخر كام ولا الدفعة المقدمة فين؛ الرصيد بس كان بيطلع من استعلام.</li>
<li><b>عندنا دلوقتي:</b> «سند صرف» للمورد شغال من المرحلة 5 (<span dir="ltr">PV-2026-00001</span> — مسودة ← ترحيل بقيد) من غير توزيع. البند ده بيضيفله جدول <span dir="ltr">cash.voucher_allocations</span> (السند · الفاتورة · المبلغ) + «الرصيد غير الموزّع».</li>
<li><b>المتبقي على الفاتورة</b> = الإجمالي − المرتجع المربوط بيها (مرتجع المشتريات) − السداد المرحّل قبل كده. المسودات <b>مابتخصمش</b> من المتبقي — بس وقت الترحيل البرنامج بيقفل الفاتورة ويتأكد تاني (جهازين بيدفعوا نفس الفاتورة ← التاني يترفض لو عدّى المتبقي).</li>
<li>جرّب: «⚡ وزّع الأقدم الأول» · اكتب مبلغ أكبر من المتبقي ← ✖ · كبّر مبلغ السند ← الباقي يبقى دفعة مقدمة · السند التاني مرحّل (التوزيع مقفول إلا بصلاحية) · السند التالت «مقدم على أمر توريد» · النموذج 6 بيوزّع الدفعات القديمة · والشريط الأصفر: 🔑 الصلاحيات و🔁 جهاز تاني.</li>
</ul>`;
const QS=`<b>❓ محتاج منك (وجنب كل سؤال اقتراحي — لو مارديتش هنفّذ بالاقتراح):</b>
<ol>
<li><b>رقم النموذج</b> (1–10) — أو خلط (مثلاً «1 + شاشة التسوية من 6»).</li>
<li><b>نفس شاشة «سند الصرف» الموجودة ولا شاشة جديدة؟</b> اقتراحي: <b>نفس الشاشة</b> (النموذج 1) — سند واحد للمورد بيتوزّع، بدل شاشتين بيعملوا نفس القيد · وشاشة «تسوية الموردين» (النموذج 6) لوحدها للتوزيع بعدين.</li>
<li><b>التوزيع: الأقدم الأول ولا يدوي؟</b> اقتراحي: <b>يدوي، وزرار «⚡ وزّع الأقدم الأول»</b> بيملاه في ثانية (بتاريخ الاستحقاق) وتقدر تغيّر فيه · ومش إجباري توزّع (سند من غير توزيع = دفعة مقدمة).</li>
<li><b>الدفعة المقدمة (الباقي اللي مااتوزّعش):</b> اقتراحي زي قرار العملاء (السؤال 15): <b>بتفضل على حساب المورد 2101 «رصيد غير موزّع»</b> وتتوزّع بعدين على أي فاتورة — <b>أو</b> على أمر توريد معيّن · ولا حساب لوحده «1107 دفعات مقدمة للموردين» (أصل) والقيد بيتقسم؟ (جرّب الاتنين من الشريط الأصفر).</li>
<li><b>فروق العملة:</b> فواتير المورد بالدولار <b>بتظهر بس</b> ومش بتتوزّع دلوقتي — السند بالجنيه، والسداد بالعملة وفروقها مع <b>المرحلة 8</b> زي ما اتأجّلت (اقتراحي).</li>
<li><b>مرتجعات المشتريات:</b> المرتجع <b>المربوط بفاتورة بيقلّل المتبقي عليها لوحده</b> · والمرتجع من غير فاتورة (آجل) بيبقى «رصيد غير موزّع» زي الدفعة المقدمة ويتوزّع في التسوية (اقتراحي).</li>
<li><b>رصيد أول المدة للمورد</b> (من «الأرصدة الافتتاحية») بيظهر سطر لوحده «رصيد أول المدة» ويتوزّع عليه زي الفاتورة (اقتراحي).</li>
<li><b>تعديل التوزيع بعد الترحيل:</b> مسموح <b>بصلاحية «تعديل توزيع سند مرحّل»</b> من غير إلغاء ترحيل — لأنه مابيغيّرش القيد (اقتراحي) · وإلغاء ترحيل السند بيشيل توزيعه.</li>
<li><b>الفاتورة النقدية</b> مسددة لوحدها مع الفاتورة (مابتظهرش في التوزيع إلا لو علّمت «اعرض المسددة») (اقتراحي).</li>
<li><b>شيكات الموردين</b> (المرحلة 5): الشيك اللي بنكتبه للمورد يتوزّع على الفواتير بنفس الطريقة؟ اقتراحي: <b>أيوه</b>، نفس جدول التوزيع في شاشة الشيك (بعد ما تختار النموذج).</li>
<li><b>المتأخر:</b> ⚠ لو فيه فاتورة متأخرة مااتسددتش والسند بيدفع أحدث منها — تحذير بس (اقتراحي).</li>
<li><b>نقل الأكسس:</b> الـ 439 سند مش هيتنقلوا — أثرهم في أرصدة الموردين الافتتاحية (اقتراحي).</li>
<li><b>المكان والصلاحيات:</b> «سند صرف» مكانه في «الخزينة» ← «السندات» زي ما هو + اختصار في «المشتريات» · و«تسوية الموردين» في «المشتريات» · صلاحيات: التوزيع جزء من «تعديل» السند + «تعديل توزيع سند مرحّل» + «تسوية الموردين» (اقتراحي).</li>
<li><b>سند القبض للعملاء</b> هيتعمل له نفس التوزيع على فواتير المبيعات لما نوصل المرحلة 8 (نفس الجدول <span dir="ltr">cash.voucher_allocations</span>) (اقتراحي).</li>
</ol>`;

  if(g("[data-auto]")){if(!canAl())return;if(!(+v.amt>0)){say("✖ اكتب مبلغ السند الأول","no");render();return;}const keep=V.m===8?{...v.al}:null;
    if(keep){let left=r2(v.amt-sumAl(v));openDocs(v,0).filter(o=>o.cur==="EGP"&&!(+v.al[o.no]>0)).sort((a,b)=>(V.ord==="due"?(a.due||a.date).localeCompare(b.due||b.date):a.date.localeCompare(b.date))).forEach(o=>{const t=Math.min(left,remain(o,v));if(t>0){v.al[o.no]=r2(t);left=r2(left-t);}});}
    else autoAl(v);say(`⚡ اتوزّع ${mf(sumAl(v))} على الأقدم الأول (${V.ord==="due"?"بالاستحقاق":"بتاريخ الفاتورة"})${unal(v)>0?` — فاضل ${mf(unal(v))} دفعة مقدمة`:''}`);render();return;}
  if(g("[data-zero]")){if(!canAl())return;v.al={};sync();say("↺ التوزيع اتصفّر","inf");render();return;}
  if(x=g("[data-full]")){const o=doc(x.dataset.full);v.al[o.no]=remain(o,v);sync();V.msg="";render();return;}
  if(x=g("[data-rmal]")){delete v.al[x.dataset.rmal];render();return;}
  if(g("[data-pkadd]")){const n=V.pk.no,a=r2(+V.pk.a||0);if(!n||!(a>0)){say("✖ اختار الفاتورة واكتب المبلغ","no");render();return;}v.al[n]=r2((+v.al[n]||0)+a);V.pk={};say(`✔ ${n} اتضافت بـ ${mf(a)}`);render();return;}
  if(g("[data-ref]")){V.cf=0;say("⟳ اتحدّث من القاعدة — آخر إصدار للسند والمتبقي على الفواتير قدامك","inf");render();return;}
  if(g("[data-save]")){if(V.cf&&ed())say("✖ ماتحفظش: السند اتعدّل من جهاز تاني — اعمل «⟳ تحديث» وراجع","no");else if(!ed()){const er=checks(v).filter(c=>c[0]==="no");say(er.length?"✖ "+er.map(c=>c[1]).join(" · "):"💾 التوزيع الجديد اتحفظ (بصلاحية «تعديل توزيع سند مرحّل») — القيد زي ما هو",er.length?"no":"ok");}else say("💾 اتحفظ مسودة بالتوزيع (من غير قيد — ومابيخصمش من الفواتير لحد الترحيل)");render();return;}
  if(g("[data-edit]")){say(V.realloc?"المرحّل: تقدر تعدّل التوزيع بس (عندك الصلاحية) — المبلغ والخزنة محتاجين «إلغاء الترحيل»":"المرحّل مايتعدّلش — «إلغاء الترحيل» الأول (بصلاحية)، أو صلاحية «تعديل توزيع سند مرحّل» للتوزيع بس","inf");render();return;}
  if(g("[data-new]")){newV();say("＋ سند صرف جديد (مسودة) — اختار المورد والمبلغ ووزّع","inf");render();return;}
  if(g("[data-post]")){post(v);render();return;}
  if(g("[data-unpost]")){unpost(v);render();return;}
  if(g("[data-del]")){VO.splice(V.d,1);V.d=Math.max(0,Math.min(V.d,VO.length-1));if(!VO.length)newV();V.cf=0;say("🗑 المسودة اتمسحت","inf");render();return;}
  if(g("[data-can]")){V.msg="";say("✕ اتلغى التعديل اللي ماتحفظش","inf");render();return;}
});
render();
</script>
</body>
</html>
